%YAML:1.0

#Rotation from laser frame to imu frame, imu^R_laser
extrinsicRotation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d  
  data: [1., 0., 0.,
        0., 1., 0.,
        0., 0., 1.]
  # data: [-1., 0., 0.,
  #       0., 1., 0.,
  #       0., 0., -1.]

#Translation from laser frame to imu frame, imu^T_laser
extrinsicTranslation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  # User-supplied lever arm is [0,0,0.28], but on Sept2 it made horizontal APE
  # 2x worse (2.911 -> 5.808 m) while improving Z span (124 -> 45 m) - likely a
  # sign-convention issue. Reverted to zero pending a [0,0,-0.28] test.
  data: [0.0, 0.0, 0.0]


imu_laser_rotation_offset: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [0.0, 0.0, 0.0] #[0.0, 0.5, 0.0]

yaw_ratio: 0.0
