# Common configuration for APM2 autopilot
#
# 2026-08-30: each mavros plugin here genuinely runs as its own separate rclcpp::Node (see
# mavros/include/mavros/plugin.hpp's Plugin(uas_, subnode) constructor -
# `Node::make_shared(subnode, parent_namespace)`, NOT the commented-out create_sub_node()) -
# `ros2 node list` shows /rover1/local_position, /rover1/global_position, /rover1/sys, etc as
# real independent nodes sharing the parent's namespace.
#
# BUT the stock "/**/<plugin>:" wildcard key format does NOT match those nodes on this build -
# confirmed live with a minimal isolated single-param file: "/**/local_position: {tf.send:
# true}" left tf.send at its compiled-in default (false), while the exact fully-qualified
# "/rover1/local_position: {tf.send: true}" applied correctly. So every key below is a
# fully-qualified "/rover2/<plugin>:" path instead of "/**/<plugin>:" - this makes
# the file inherently robot_namespace-dependent (an empty robot_namespace would produce an
# invalid "//<plugin>:" key), which is fine for mavros_hardware.launch.py (defaults
# robot_namespace to "rover1", never empty) but means this file can't be reused as-is for an
# unnamespaced single-robot case the way ekf_localization.yaml's "/**:" can.
#
# Every frame_id/child_frame_id/tf.frame_id/tf.child_frame_id value (not just the keys) also
# uses the rover2 placeholder token - substitute it via
# nav2_common.launch.ReplaceString before mavros ever sees the file (mavros_hardware.launch.py
# already does this, same substitution pass covers both the keys and the values).
# tf.global_frame_id: "earth" is deliberately left UNCHANGED - it's the shared REP-105-style
# ECEF/geographic root frame, not a per-robot frame, so it should stay the same across every
# rover. Say if you want that namespaced too.
/**:
  ros__parameters:
    startup_px4_usb_quirk: false

# --- UAS node itself (NOT a plugin) ---
#
# 2026-08-30: these three are declared by the UAS node (mavros_uas.cpp:83-85), NOT by any
# plugin, and they default to the BARE "base_link"/"odom"/"map" (mavros_uas.cpp:51-53).
# UAS::setup_static_tf() (uas_tf.cpp:51-67) uses them to publish three ENU->NED / FLU->FRD
# helper transforms on /tf_static:
#     <map_frame_id>        -> <map_frame_id>_ned
#     <odom_frame_id>       -> <odom_frame_id>_ned
#     <base_link_frame_id>  -> <base_link_frame_id>_frd
# That call is UNCONDITIONAL (mavros_uas.cpp:164) - it is NOT gated by any plugin's
# "tf.send", so setting those false does not stop it. Left at the defaults, every rover
# publishes an identical bare map/odom/base_link onto the shared /tf_static, which is
# exactly the cross-rover frame collision this project namespaces everything to avoid
# (seen live in frames_2026-08-30_17.58.48.pdf). Namespacing them here keeps the helper
# frames valid AND per-robot. The node name is "mavros" from mavros_node.cpp:84.
/rover2/mavros:
  ros__parameters:
    base_link_frame_id: "rover2/base_link"
    odom_frame_id: "rover2/odom"
    map_frame_id: "rover2/map"

# --- system plugins ---

# sys_status
/rover2/sys:
  ros__parameters:
    min_voltage: [10.0]   # diagnostics min voltage, use a vector i.e. [16.2, 16.0] for multiple batteries, up-to 10 are supported
                          # to achieve the same on a ROS launch file do: <rosparam param="sys/min_voltage">[16.2, 16.0]</rosparam>
    disable_diag: false   # disable all sys_status diagnostics, except heartbeat
    heartbeat_rate: 1.0   # send heartbeat rate in Hertz
    heartbeat_mav_type: "ONBOARD_CONTROLLER"
    conn_timeout: 10.0    # heartbeat timeout in seconds

# sys_time
/rover2/time:
  ros__parameters:
    time_ref_source: "fcu"    # time_reference source
    timesync_mode: MAVLINK
    timesync_avg_alpha: 0.6   # timesync averaging factor
    timesync_rate: 10.0       # TIMESYNC rate in Hertz (feature disabled if 0.0)
    system_time_rate: 1.0     # send system time to FCU rate in Hertz (disabled if 0.0)

# --- mavros plugins (alphabetical order) ---

# 3dr_radio
/rover2/tdr_radio:
  ros__parameters:
    low_rssi: 40  # raw rssi lower level for diagnostics

# actuator_control
# None

# command
/rover2/cmd:
  ros__parameters:
    use_comp_id_system_control: false   # quirk for some old FCUs

# dummy
# None

# ftp
# None

# global_position
/rover2/global_position:
  ros__parameters:
    frame_id: "rover2/map"               # origin frame
    child_frame_id: "rover2/base_link"   # body-fixed frame
    rot_covariance: 99999.0       # covariance for attitude?
    gps_uere: 1.0                 # User Equivalent Range Error (UERE) of GPS sensor (m)
    use_relative_alt: true        # use relative altitude for local coordinates
    tf.send: false                # send TF? (kept off - would conflict with local_position's
                                   # own broadcast below if both enabled, see its note)
    tf.frame_id: "rover2/map"            # TF frame_id
    tf.global_frame_id: "earth"   # TF earth frame_id - shared global frame, NOT namespaced
    tf.child_frame_id: "rover2/base_link"  # TF child_frame_id

# imu_pub
/rover2/imu:
  ros__parameters:
    frame_id: "rover2/base_link"
    # need find actual values
    linear_acceleration_stdev: 0.0003
    angular_velocity_stdev: 0.0003490659  # 0.02 degrees
    orientation_stdev: 1.0
    magnetic_stdev: 0.0

# local_position
/rover2/local_position:
  ros__parameters:
    frame_id: "rover2/odom"
    tf.send: false   # 2026-08-30: mavros must publish NO TF at all. EKF (publish_tf: true in
                     # lirovo_hardware.launch.py's ekf_localization.yaml, world_frame ==
                     # odom_frame) is the sole owner of odom->base_link; with this true, both
                     # broadcast the SAME frame pair onto the shared /tf and overwrite each
                     # other at full rate. Leave false - do not re-enable unless the EKF is
                     # simultaneously switched to publish_tf: false.
    tf.frame_id: "rover2/odom"    # NOTE: "odom" not stock "map" - matches this
                                               # project's static_tf_odom (map->odom) + EKF
                                               # (odom->base_link) chain in
                                               # lirovo_hardware.launch.py. Inert while
                                               # tf.send is false, but tf.child_frame_id below
                                               # is NOT inert - local_position.cpp:163 uses it
                                               # for the odom message's own child_frame_id,
                                               # which is what EKF's odom1 twist relies on.
    tf.child_frame_id: "rover2/base_link"
    tf.send_fcu: false

# param
# None, used for FCU params

# rc_io
# None

# setpoint_accel
/rover2/setpoint_accel:
  ros__parameters:
    send_force: false

# setpoint_attitude
/rover2/setpoint_attitude:
  ros__parameters:
    reverse_thrust: false       # allow reversed thrust
    use_quaternion: false       # enable PoseStamped topic subscriber
    tf.listen: false            # enable tf listener (disable topic subscribers)
    tf.frame_id: "rover2/map"
    tf.child_frame_id: "rover2/target_attitude"
    tf.rate_limit: 50.0

# setpoint_raw
/rover2/setpoint_raw:
  ros__parameters:
    thrust_scaling: 1.0         # specify thrust scaling (normalized, 0 to 1) for thrust (like PX4)

# setpoint_position
/rover2/setpoint_position:
  ros__parameters:
    tf.listen: false            # enable tf listener (disable topic subscribers)
    tf.frame_id: "rover2/map"
    tf.child_frame_id: "rover2/target_position"
    tf.rate_limit: 50.0
    mav_frame: LOCAL_NED

# guided_target
/rover2/guided_target:
  ros__parameters:
    tf.listen: false           # enable tf listener (disable topic subscribers)
    tf.frame_id: "rover2/map"
    tf.child_frame_id: "rover2/target_position"
    tf.rate_limit: 50.0

# setpoint_velocity
/rover2/setpoint_velocity:
  ros__parameters:
    mav_frame: LOCAL_NED

# vfr_hud
# None

# waypoint
/rover2/mission:
  ros__parameters:
    pull_after_gcs: true        # update mission if gcs updates
    use_mission_item_int: true  # use the MISSION_ITEM_INT message instead of MISSION_ITEM
                                # for uploading waypoints to FCU

# --- mavros extras plugins (same order) ---

# adsb
# None

# debug_value
# None

# distance_sensor
## Currently available orientations:
#    Check http://wiki.ros.org/mavros/Enumerations
##
/rover2/distance_sensor:
  ros__parameters:
    config: |
      rangefinder_pub:
        id: 0
        frame_id: "rover2/lidar"
        # orientation: PITCH_270  # sended by FCU
        field_of_view: 0.0        # XXX TODO
        send_tf: false
        sensor_position: {x:  0.0, y:  0.0, z:  -0.1}
      rangefinder_sub:
        subscriber: true
        id: 1
        orientation: PITCH_270  # only that orientation are supported by APM 3.4+

# image_pub
/rover2/image:
  ros__parameters:
    frame_id: "rover2/px4flow"

# fake_gps
/rover2/fake_gps:
  ros__parameters:
    # select data source
    use_mocap: true               # ~mocap/pose
    mocap_transform: false        # ~mocap/tf instead of pose
    mocap_withcovariance: false   # ~mocap/pose uses PoseWithCovarianceStamped Message
    use_vision: false             # ~vision (pose)
    use_hil_gps: true
    gps_id: 4
    # origin (default: Zürich)
    geo_origin.lat: 47.3667       # latitude [degrees]
    geo_origin.lon: 8.5500        # longitude [degrees]
    geo_origin.alt: 408.0         # altitude (height over the WGS-84 ellipsoid) [meters]
    eph: 2.0
    epv: 2.0
    horiz_accuracy: 0.5
    vert_accuracy: 0.5
    speed_accuracy: 0.0
    satellites_visible: 6     # virtual number of visible satellites
    fix_type: 3               # type of GPS fix (default: 3D)
    tf.listen: false
    tf.send: false            # send TF?
    tf.frame_id: "rover2/map"        # TF frame_id
    tf.child_frame_id: "rover2/fix"  # TF child_frame_id
    tf.rate_limit: 10.0       # TF rate
    gps_rate: 5.0             # GPS data publishing rate

# landing_target
/rover2/landing_target:
  ros__parameters:
    listen_lt: false
    mav_frame: "LOCAL_NED"
    land_target_type: "VISION_FIDUCIAL"
    image.width: 640              # [pixels]
    image.height: 480
    camera.fov_x: 2.0071286398    # default: 115 [degrees]
    camera.fov_y: 2.0071286398
    tf.send: false   # 2026-08-30: forced false with local_position's - mavros publishes no TF
                     # at all on this project. (landing_target is not in apm_pluginlists.yaml's
                     # allowlist so it never loads today; this is belt-and-braces for if it is
                     # ever added - note its compiled-in default is TRUE,
                     # landing_target.cpp:152, unlike every other plugin's false.)
    tf.listen: false
    tf.frame_id: "rover2/landing_target"
    tf.child_frame_id: "rover2/camera_center"
    tf.rate_limit: 10.0
    target_size: {x: 0.3, y: 0.3}

# mocap_pose_estimate
/rover2/mocap:
  ros__parameters:
    # select mocap source
    use_tf: false   # ~mocap/tf
    use_pose: true  # ~mocap/pose

# mount_control
/rover2/mount:
  ros__parameters:
    debounce_s: 4.0
    err_threshold_deg: 10.0
    negate_measured_roll: false
    negate_measured_pitch: false
    negate_measured_yaw: false

# odom
/rover2/odometry:
  ros__parameters:
    # NOTE: odom_child_id_des was already "map" in the stock upstream file too (looks like a
    # copy-paste bug - a child frame equal to its own parent is unusual for an odom chain,
    # you'd normally expect base_link here) - namespaced as-is, not silently changed to
    # base_link. Flag if you want that corrected instead of just namespaced.
    fcu.odom_parent_id_des: "rover2/map"   # desired parent frame rotation of the FCU's odometry
    fcu.odom_child_id_des: "rover2/map"    # desired child frame rotation of the FCU's odometry

# px4flow
/rover2/px4flow:
  ros__parameters:
    frame_id: "rover2/px4flow"
    ranger_fov: 0.118682      # 6.8 degrees at 5 meters, 31 degrees at 1 meter
    ranger_min_range: 0.3     # meters
    ranger_max_range: 5.0     # meters

# vision_pose_estimate
/rover2/vision_pose:
  ros__parameters:
    tf.listen: false           # enable tf listener (disable topic subscribers)
    tf.frame_id: "rover2/map"
    tf.child_frame_id: "rover2/vision_estimate"
    tf.rate_limit: 10.0

# vision_speed_estimate
/rover2/vision_speed:
  ros__parameters:
    listen_twist: true    # enable listen to twist topic, else listen to vec3d topic
    twist_cov: true       # enable listen to twist with covariance topic

# vibration
/rover2/vibration:
  ros__parameters:
    frame_id: "rover2/base_link"

# wheel_odometry
/rover2/wheel_odometry:
  ros__parameters:
    count: 2                      # number of wheels to compute odometry
    use_rpm: false                # use wheel's RPM instead of cumulative distance to compute odometry
    wheel0: {x: 0.14, y: -0.35, radius: 0.0}  # x-, y-offset (m,NED) and radius (m)
    wheel1: {x: 0.14, y:  0.35, radius: 0.0}  # x-, y-offset (m,NED) and radius (m)
    send_raw: true                # send wheel's RPM and cumulative distance (~/wheel_odometry/rpm, ~/wheel_odometry/distance)
    send_twist: false             # send geometry_msgs/TwistWithCovarianceStamped instead of nav_msgs/Odometry
    frame_id: "rover2/odom"               # origin frame
    child_frame_id: "rover2/base_link"   # body-fixed frame
    vel_error: 0.1                # wheel velocity measurement error 1-std (m/s)
    tf.send: false
    tf.frame_id: "rover2/odom"
    tf.child_frame_id: "rover2/base_link"

# camera
/rover2/camera:
  ros__parameters:
    frame_id: "rover2/base_link"
