slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    #odom_topic: /genz/odometry
    use_map_saver: true
    mode: mapping #localization
    use_sim_time: True #False
    publish_tf: true #............aise hi true kiya dekhne ke liye kya hota hai..ye shayad true hi hota hai by default aur ye param exist nhi karta shayad ..matlab hard coded hai shayad
    #publish_tf_map: True

    # =========================================================================
    # 4 MODULAR NARROW FOV OPTIMIZATION PARAMETERS
    # (Set true to activate, or false to run 100% stock SLAM Toolbox behavior)
    # =========================================================================

    enable_heading_radian_units: true            # Change 6: Degrees-to-radians units alignment

    enable_synchronized_intake_thresholds: true  # Change 5: Synchronized 1.0x intake thresholds

    enable_heading_scan_intake: true      # Change 1: In-place spin scan intake           runs outside scan matcher (universal)
    enable_narrow_fov_valid_points: true  # Change 2: Bypass 360 winding filter            runs only in scan matcher
    enable_coupled_covariance: true #false      # Change 3: Cross-covariance coupling     runs only in scan matcher
    enable_anisotropic_penalty: true #false      # Change 4: 3x lateral directional weight  runs only in scan matcher
    


    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05 #0.02 #if 0 never publishes odometry
    map_update_interval: 0.5 #5.0
    resolution: 0.05
    min_laser_range: 1.51 #0.21 #0.2 #1.5 #for rastering images
    max_laser_range: 40.0 #  did 20 for bcr_bot 30.0 #20.0 #for rastering images
    minimum_time_interval: 0.1 #0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: false #true
    use_scan_barycenter: false #true
    minimum_travel_distance: 0.1 #0.2 #0.5
    minimum_travel_heading: 0.06 #0.2 #0.5
    scan_buffer_size: 40 #10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 5.0 #3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.3 #0.1 #increasing it helps remove dynamic obstacles faster
