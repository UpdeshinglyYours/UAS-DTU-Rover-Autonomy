  controller_server:
    ros__parameters:
      use_sim_time: False 
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.1
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"] #, "sloppy_goal_checker"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.5 #0.25
        yaw_goal_tolerance: 6.28
      #ye niche wala meine add kiya
      sloppy_goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 1.0   
        yaw_goal_tolerance: 6.28
      
      controller_plugins: ["FollowPath", "OrbitController"] #orbit controller meine add kiya

      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 56 #56
        model_dt: 0.05
        batch_size: 2000 #2000 #2000 pf #1500
        vx_std: 0.3 #0.3 perfect follow #0.2
        vy_std: 0.0
        wz_std: 0.3 #0.3 pf #0.4
        vx_max: 1.2 #0.5 pf
        vx_min: 0.0 #-0.2 #-0.3 pf
        vy_max: 0.0
        wz_max: 0.9 #1.0
        iteration_count: 1
        prune_distance: 2.5 #1.0 #1.7 pf
        transform_tolerance: 0.1
        temperature: 0.2 #0.2 #0.4 fpf #0.3
        gamma: 0.018 #0.015
        motion_model: "DiffDrive"
        visualize: False #True
        
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3

        # CRITICAL FIX: critics must be an array of strings!
        critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
        
        # The configs must be SIBLINGS to the critics list, not nested inside it!
        ConstraintCritic:
          cost_weight: 7.0 #4.0 pf
        ObstaclesCritic:
          repulsion_weight: 4.0 #2.5 #1.5        # The strength of the magnetic push away from walls
          critical_weight: 25.0 #20.0        # Heavy penalty for getting dangerously close
          consider_footprint: true #false    # Keep false to save CPU (uses center point instead of full chassis)
          collision_cost: 100000.0
          collision_margin_distance: 0.25 #0.1 # 10cm safety bubble
          near_goal_distance: 0.5
        GoalCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.4    #important ..goal critic is off until you are within the threshold
        PreferForwardCritic:
          enabled: true
          cost_weight: 25.0 #5.0
        GoalAngleCritic:
          cost_weight: 3.0
          threshold_to_consider: 0.5
        PathAlignCritic:
          cost_weight: 12.0 #10.0 #12.0 pf #14.0
        PathFollowCritic:
          cost_weight: 8.0 #6.0 #8.0 pf #5.0
        PathAngleCritic:
          cost_weight: 2.0
        VelocityDeadbandCritic:
          cost_weight: 20.0 #35.0
          # [vx, vy, wz] -> Skid-steer rovers require more torque to turn than to drive straight!
          # If forward movement requires 0.2 m/s, turning likely requires ~0.3 rad/s to break friction.
          deadband_velocities: [0.4, 0.0, 0.0] 

        # plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

