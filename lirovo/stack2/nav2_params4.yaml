        # # CRITICAL FIX: critics must be an array of strings!
        # critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
        
        # # The configs must be SIBLINGS to the critics list, not nested inside it!
        # ConstraintCritic:
        #   cost_weight: 6.0 #4.0
        # GoalCritic:
        #   cost_weight: 5.0
