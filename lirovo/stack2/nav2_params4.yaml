  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 25.0 #20.0
        publish_frequency: 10.0
        global_frame: map
        robot_base_frame: base_link #base_link #base_link
        use_sim_time: False #False
        rolling_window: true
        width: 8 #5
        height: 8 #5
        resolution: 0.04 #0.02
        #robot_radius: 1.0 #0.2
        footprint: "[ [0.50, 0.45], [-0.50, 0.45], [-0.50, -0.45], [0.50, -0.45] ]"

        # nav2_params3: Blickfeld raw cloud -> stvl_layer replaces /scan -> obstacle_layer
        # (obstacle_layer block below is kept defined but no longer loaded).
        plugins: ["sf45b_layer", "stvl_layer", "casualty_layer", "inflation_layer"]

        # SF45/B near-field (0.4-2.0m) obstacle layer -- replaces the D415/
        # STVL path below (kept defined but no longer referenced in
        # plugins:, in case it's needed again). Consumes the SF45/B ROS
        # driver's own LaserScan output. NOTE: the SF45/B node must be
        # launched remapped so its scan topic doesn't collide with the
        # Blickfeld's own /scan (used by obstacle_layer below) -- e.g.
        # `ros2 run lightwarelidar2 sf45b --ros-args -p port:=... -r scan:=/sf45b/scan`
        sf45b_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /sf45b/scan
            raytrace_max_range: 2.0
            raytrace_min_range: 0.4
            obstacle_max_range: 2.0
            obstacle_min_range: 0.4
            min_obstacle_height: -1.0
            max_obstacle_height: 1.0
            clearing: true
            marking: true
            inf_is_valid: true
            data_type: "LaserScan"

        # D415 near-field (0.4-2.0m) obstacle layer -- consumes the raw
        # /camera/depth/points cloud directly (no LaserScan flattening).
        # Fills the gap below the Blickfeld's ~1.5-2m minimum range.
        # NOTE: dormant -- not referenced in plugins: above anymore, kept
        # here in case the D415 path is revisited later.
        stvl_camera_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

          enabled:                  true
          voxel_decay:              4.0     # seconds -- retune live, see plan notes
          decay_model:              0       # 0=Linear, 1=Exponential, -1=Persistent
          voxel_size:               0.05
          track_unknown_space:      true
          mark_threshold:           0
          update_footprint_enabled: true
          combination_method:       1
          origin_z:                 0.0
          publish_voxel_map:        true
          transform_tolerance:      0.3
          mapping_mode:             false
          map_save_duration:        60.0
          publish_z_max:            2.0
          observation_sources:      camera_mark camera_clear
          camera_mark:
            data_type: PointCloud2
            topic: /camera/depth/points
            marking: true
            clearing: false
            obstacle_range: 2.0
            obstacle_min_range: 0.4
            min_obstacle_height: 0.12
            max_obstacle_height: 1.0
            expected_update_rate: 3600.0
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 2 
            clear_after_reading: true
          camera_clear:
            enabled: true
            data_type: PointCloud2
            topic: /camera/depth/points
            marking: false
            clearing: true
            max_z: 2.1
            min_z: 0.3
            expected_update_rate: 3600.0
            vertical_fov_angle: 0.70    # D415 real depth FOV (~40 deg)
            vertical_fov_padding: 0.05
            horizontal_fov_angle: 1.13  # D415 real depth FOV (~65 deg)
            decay_acceleration: 10.0 #1.0
            model_type: 0 #1 
            clear_after_reading: true

        #casualty layer meine add kari -----------------------------------
        casualty_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: casualty_ring
          casualty_ring:
            data_type: PointCloud2
            topic: /casualty_keepout
            marking: true
            clearing: false        # <-- CRITICAL: Prevents your real LiDAR from erasing the rings
            obstacle_max_range: 100.0  # (Use obstacle_max_range and raytrace_max_range for Foxy/Humble)
            raytrace_max_range: 100.0
            min_obstacle_height: 0.2
            max_obstacle_height: 1.0
            inf_is_valid: false

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            raytrace_max_range: 10.0 #20.0 #6
            raytrace_min_range: 0.4 #1.5 #0.55 #new addition # actually exact 43cm hai
            obstacle_max_range: 10.0 #6
            obstacle_min_range: 0.4 #1.5 #0.2 #0.1
            min_obstacle_height: -1.0 #new addition
            max_obstacle_height: 1.0 #2.0
            clearing: true
            marking: true
            inf_is_valid: true
            data_type: "LaserScan"

        # Same as the global_costmap stvl_layer below, except voxel_size matches
        # this costmap's 0.04 m resolution (a coarser voxel leaves unfilled cells)
        # and publish_voxel_map is off (it republishes on every 25 Hz update).
        stvl_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

          enabled:                  true
          voxel_decay:              2.0
          decay_model:              0       # 0=Linear, 1=Exponential, -1=Persistent
          voxel_size:               0.04
          track_unknown_space:      true
          mark_threshold:           2       # >= 2 stacked voxels per column to mark lethal
          update_footprint_enabled: true
          combination_method:       1
          origin_z:                 0.0
          publish_voxel_map:        false
          transform_tolerance:      1.0     # nav2_params4: was 0.3. Also the cloud MessageFilter timeout; GenZ TF >0.3 s late preceded every costmap freeze (2026-10-18)
          mapping_mode:             false
          map_save_duration:        60.0
          publish_z_max:            2.0
          observation_sources:      livox_mark livox_clear
          livox_mark:
            data_type: PointCloud2
            topic: /patchwork/nonground   # Patchwork++ obstacles; clearing below still uses the raw cloud
            marking: true
            clearing: false
            obstacle_range: 15.0
            obstacle_min_range: 1.5
            min_obstacle_height: 0.10 #0.15
            max_obstacle_height: 1.2
            expected_update_rate: 2.0   # ~20 missed clouds = real dropout; 0.5 tripped on startup hiccups
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 3
            clear_after_reading: true
          livox_clear:
            enabled: true
            data_type: PointCloud2
            topic: /bf_lidar/point_cloud_out
            marking: false
            clearing: true
            max_z: 15.0
            min_z: 1.5
            # 0 disables the staleness check: STVL 2.3.4 never refreshes a
            # clearing-only source's timestamp (measurement_buffer.cpp:135), so
            # any nonzero value reports a false "stale sensor" (clearing still runs).
            expected_update_rate: 0.0
            vertical_fov_angle: 0.576
            vertical_fov_padding: 0.05
            horizontal_fov_angle: 1.221
            decay_acceleration: 2400.0
            model_type: 1
            clear_after_reading: true

        new_static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          footprint_clearing_enabled: True
          map_subscribe_transient_local: True
          map_topic: /map_expanded

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 1.0 #3.0 #5.0
          inflation_radius: 1.0 #0.8 #0.8 #0.5 #0.5 #0.6
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 5.0 #4.0 #2.5 #5.0
        publish_frequency: 2.0
        global_frame: map
        width: 600 #new addition
        height: 600 #new addition
        origin_x: -300.0
        origin_y: -300.0
        rolling_window: false
        robot_base_frame: base_link #base_link #base_link
        use_sim_time: False #False
        #robot_radius: 1.0 #0.2
        robot_radius: 0.75 #0.67 hai calculated (inflated footprint ke according)
        resolution: 0.1 #0.04
        track_unknown_space: false #true

        #plugins: ["static_layer", "stvl_layer", "casualty_layer", "inflation_layer"]
        # nav2_params3: Blickfeld raw cloud -> stvl_layer replaces /scan -> obstacle_layer
        # (obstacle_layer block below is kept defined but no longer loaded).
        plugins: ["sf45b_layer", "stvl_layer", "casualty_layer", "peer_rover_layer", "inflation_layer"]

        # SF45/B near-field (0.4-2.0m) obstacle layer -- same as
        # local_costmap's, see the note there re: the /sf45b/scan remap.
        sf45b_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /sf45b/scan
            raytrace_max_range: 2.0
            raytrace_min_range: 0.4
            obstacle_max_range: 2.0
            obstacle_min_range: 0.4
            min_obstacle_height: -1.0
            max_obstacle_height: 1.0
            clearing: true
            marking: true
            inf_is_valid: true
            data_type: "LaserScan"

        # D415 near-field (0.4-2.0m) obstacle layer -- same as local_costmap's,
        # duplicated per-costmap matching this file's existing pattern for
        # other layers (e.g. casualty_layer/obstacle_layer are likewise
        # defined separately in both costmaps).
        # NOTE: dormant -- not referenced in plugins: above anymore, kept
        # here in case the D415 path is revisited later.
        stvl_camera_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

          enabled:                  true
          voxel_decay:              4.0     # seconds -- retune live, see plan notes
          decay_model:              0       # 0=Linear, 1=Exponential, -1=Persistent
          voxel_size:               0.05
          track_unknown_space:      true
          mark_threshold:           0
          update_footprint_enabled: true
          combination_method:       1
          origin_z:                 0.0
          publish_voxel_map:        true
          transform_tolerance:      0.3
          mapping_mode:             false
          map_save_duration:        60.0
          publish_z_max:            2.0
          observation_sources:      camera_mark camera_clear
          camera_mark:
            data_type: PointCloud2
            topic: /camera/depth/points
            marking: true
            clearing: false
            obstacle_range: 2.0
            obstacle_min_range: 0.4
            min_obstacle_height: 0.12
            max_obstacle_height: 1.0
            expected_update_rate: 0.5
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 0
            clear_after_reading: true
          camera_clear:
            enabled: true
            data_type: PointCloud2
            topic: /camera/depth/points
            marking: false
            clearing: true
            max_z: 2.1
            min_z: 0.3
            expected_update_rate: 3600.0
            vertical_fov_angle: 0.70    # D415 real depth FOV (~40 deg)
            vertical_fov_padding: 0.05
            horizontal_fov_angle: 1.13  # D415 real depth FOV (~65 deg)
            decay_acceleration: 10.0 #1.0
            model_type: 0 #1
            clear_after_reading: true

        peer_rover_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: rover1_obstacles
          rover1_obstacles:
            data_type: PointCloud2
            topic: /obstacle_keepout1
            marking: true
            clearing: false
            obstacle_max_range: 500.0
            raytrace_max_range: 500.0
            min_obstacle_height: 0.0
            max_obstacle_height: 1.5

        #global costmap mein obstacle layer maine add kari ..local costmap mein pehle se thi
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            raytrace_max_range: 40.0 #15.0 #30.0
            raytrace_min_range: 1.5 #0.55 #new addition  # actually exact 43cm hai
            obstacle_max_range: 40.0
            obstacle_min_range: 1.5 #0.2 #0.1
            min_obstacle_height: -1.0 #new addition
            max_obstacle_height: 1.0
            clearing: true
            marking: true
            inf_is_valid: true
            data_type: "LaserScan"

        #casualty_layer meine add kari -------------------------
        casualty_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: casualty_ring
          casualty_ring:
            data_type: PointCloud2
            topic: /casualty_keepout
            marking: true
            clearing: false        # <-- CRITICAL: Prevents your real LiDAR from erasing the rings
            obstacle_max_range: 100.0  # (Use obstacle_max_range and raytrace_max_range for Foxy/Humble)
            raytrace_max_range: 100.0
            min_obstacle_height: 0.2
            max_obstacle_height: 1.0
            inf_is_valid: false

        stvl_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

          enabled:                  true
          # Linear 30 s memory. Outside the lidar's view (sides, behind, beyond 15 m,
          # and the <1.5 m blind ring) nothing clears voxels, so they expire after
          # voxel_decay. Inside the view, livox_clear erases unconfirmed voxels when
          # 30 - t - decay_acceleration*t^3/6 < 0, i.e. ~0.4 s after their last mark.
          # Persistent (-1) was tried: stale marks out of view piled up as ghosts.
          voxel_decay:              30.0 #5.0 #3600.0 #2.5 #0.5
          decay_model:              0 #-1 #2 .. persistent #-1 #0
          voxel_size:               0.05
          track_unknown_space:      true
          mark_threshold:           2       # >= 2 stacked voxels per column to mark lethal
          update_footprint_enabled: true
          combination_method:       1
          origin_z:                 0.0
          publish_voxel_map:        true
          transform_tolerance:      1.0     # nav2_params4: was 0.3 (see the local stvl_layer)
          mapping_mode:             false
          map_save_duration:        60.0
          publish_z_max:            2.0 #new addition
          observation_sources:      livox_mark livox_clear
          livox_mark:
            data_type: PointCloud2
            topic: /patchwork/nonground #/bf_lidar/point_cloud_out #/segmentation/obstacle  -- clearing below still uses the raw cloud
            marking: true
            clearing: false
            obstacle_range: 15.0 #3.0 
            obstacle_min_range: 1.5 #new addition
            min_obstacle_height: 0.15 #0.1 #-0.4
            max_obstacle_height: 1.2 #2.0
            expected_update_rate: 2.0 #0.5 #3600.0 #0.3 #seconds #0.0  -- 0.5 tripped on startup hiccups
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 3 #2 #0
            clear_after_reading: true
          livox_clear:
            enabled: true
            data_type: PointCloud2
            topic: /bf_lidar/point_cloud_out #/segmentation/obstacle
            marking: false
            clearing: true
            max_z: 15.0 #8.0
            min_z: 1.5 #1.0
            # 0 disables the staleness check: STVL 2.3.4 never refreshes a
            # clearing-only source's timestamp (measurement_buffer.cpp:135), so
            # any nonzero value reports a false "stale sensor" (clearing still runs).
            expected_update_rate: 0.0 #3600.0 #0.3 #seconds # new addition
            vertical_fov_angle: 0.576 #1.029
            vertical_fov_padding: 0.05
            horizontal_fov_angle: 1.221 #6.29
            decay_acceleration: 2400.0 #5.0
            model_type: 1
            clear_after_reading: true #new addition

        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          footprint_clearing_enabled: True
          map_subscribe_transient_local: True
        new_static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          footprint_clearing_enabled: True
          map_subscribe_transient_local: True
          map_topic: /map_expanded
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 1.0 #3.0 #8.0
          inflation_radius: 1.0 #0.8 #0.5 #0.7
        always_send_full_costmap: True

  map_saver:
    ros__parameters:
      use_sim_time: False #False
      save_map_timeout: 5.0
      free_thresh_default: 0.25
      occupied_thresh_default: 0.65
      map_subscribe_transient_local: True

  planner_server:
    ros__parameters:
      expected_planner_frequency: 5.0 #5.0
      use_sim_time: False #False
      planner_plugins: ["GridBased"]
      GridBased:
        #plugin: "nav2_navfn_planner/NavfnPlanner"
        #tolerance: 0.5
        #use_astar: true #false
        #allow_unknown: true
        
        plugin: "nav2_smac_planner/SmacPlanner2D"
        tolerance: 0.5
        allow_unknown: true
        
        # Smac 2D Specific Magic:
        downsample_costmap: True #False       # Set to True if your CPU is lagging!
        downsampling_factor: 2          # How much to downsample if True
        cost_travel_multiplier: 4.0 #3.0 #2.0     # Higher = Stays further away from obstacles
        use_final_approach_orientation: True # Smoothly points the nose at the final goal
        smoother_max_iterations: 1000   # Guarantees a buttery-smooth curve for MPPI #param should be inside smoother: .. and is max_iteration
        

        
          

  behavior_server:
    ros__parameters:
      use_sim_time: False #False

      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw

      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint

      cycle_frequency: 10.0

      behavior_plugins:
        - spin
        - backup
        - wait

      spin:
        plugin: "nav2_behaviors/Spin"

      backup:
        plugin: "nav2_behaviors/BackUp"

      wait:
        plugin: "nav2_behaviors/Wait"

      local_frame: odom
      global_frame: map
      robot_base_frame: base_link #base_link

      transform_tolerance: 0.3
      simulate_ahead_time: 3.0

      max_rotational_vel: 0.5
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.5

