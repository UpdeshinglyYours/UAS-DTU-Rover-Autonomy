# Real-rover Nav2 parameters for the georeferenced DTU prior map. This file is
# selected only by global_localization:=dtu_rtk; the existing SLAM parameters
# remain the default.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.3
      vx_max: 0.9
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 0.9
      iteration_count: 1
      prune_distance: 2.5
      transform_tolerance: 0.1
      temperature: 0.2
      gamma: 0.018
      motion_model: DiffDrive
      visualize: false
      critics:
        - ConstraintCritic
        - ObstaclesCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - VelocityDeadbandCritic
      ConstraintCritic:
        cost_weight: 7.0
      ObstaclesCritic:
        repulsion_weight: 4.0
        critical_weight: 25.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.25
        near_goal_distance: 0.5
      GoalCritic:
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        cost_weight: 12.0
      PathFollowCritic:
        cost_weight: 8.0
      PathAngleCritic:
        cost_weight: 2.0
      PreferForwardCritic:
        enabled: true
        cost_weight: 25.0
      VelocityDeadbandCritic:
        cost_weight: 20.0
        deadband_velocities: [0.2, 0.0, 0.0]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 25.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.04
      footprint: "[[0.50, 0.45], [-0.50, 0.45], [-0.50, -0.45], [0.50, -0.45]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /dtu_static_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 1.5
          obstacle_max_range: 20.0
          raytrace_min_range: 1.5
          raytrace_max_range: 15.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: false
      resolution: 0.25
      track_unknown_space: false
      footprint: "[[0.50, 0.45], [-0.50, 0.45], [-0.50, -0.45], [0.50, -0.45]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      filters: [road_preference_filter]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /dtu_static_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 1.5
          obstacle_max_range: 30.0
          raytrace_min_range: 1.5
          raytrace_max_range: 30.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.5
      road_preference_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /dtu_centerline_filter_info
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      cost_travel_multiplier: 3.0
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      use_final_approach_orientation: true
      smoother:
        tolerance: 1.0e-10
        max_iterations: 1000
        w_data: 0.2
        w_smooth: 0.3
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.2, 0.0, 1.2]
    min_velocity: [-1.2, 0.0, -1.2]
    max_accel: [4.0, 0.0, 6.0]
    max_decel: [-4.0, 0.0, -6.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.4]
    velocity_timeout: 1.0
