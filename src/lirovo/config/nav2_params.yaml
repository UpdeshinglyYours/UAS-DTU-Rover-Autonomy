    bt_navigator:
        ros__parameters:
          use_sim_time: True #False
          global_frame: map
          robot_base_frame: base_footprint
          odom_topic: /genz/odometry
          bt_loop_duration: 10
          default_server_timeout: 20
          plugin_lib_names:
          - nav2_compute_path_to_pose_action_bt_node
          - nav2_compute_path_through_poses_action_bt_node
          - nav2_follow_path_action_bt_node
          - nav2_back_up_action_bt_node
          - nav2_spin_action_bt_node
          - nav2_wait_action_bt_node
          - nav2_clear_costmap_service_bt_node
          - nav2_is_stuck_condition_bt_node
          - nav2_goal_reached_condition_bt_node
          - nav2_goal_updated_condition_bt_node
          - nav2_initial_pose_received_condition_bt_node
          - nav2_reinitialize_global_localization_service_bt_node
          - nav2_rate_controller_bt_node
          - nav2_distance_controller_bt_node
          - nav2_speed_controller_bt_node
          - nav2_truncate_path_action_bt_node
          - nav2_goal_updater_node_bt_node
          - nav2_recovery_node_bt_node
          - nav2_pipeline_sequence_bt_node
          - nav2_round_robin_node_bt_node
          - nav2_transform_available_condition_bt_node
          - nav2_time_expired_condition_bt_node
          - nav2_distance_traveled_condition_bt_node
          - nav2_single_trigger_bt_node
          - nav2_is_battery_low_condition_bt_node
          - nav2_navigate_through_poses_action_bt_node
          - nav2_navigate_to_pose_action_bt_node
          - nav2_remove_passed_goals_action_bt_node
          - nav2_planner_selector_bt_node
          - nav2_controller_selector_bt_node
          - nav2_goal_checker_selector_bt_node

    controller_server:
      ros__parameters:
        use_sim_time: True 
        controller_frequency: 20.0
        min_x_velocity_threshold: 0.001
        min_y_velocity_threshold: 0.1
        min_theta_velocity_threshold: 0.001
        failure_tolerance: 0.3
        progress_checker_plugin: "progress_checker"
        goal_checker_plugins: ["general_goal_checker"]
        progress_checker:
          plugin: "nav2_controller::SimpleProgressChecker"
          required_movement_radius: 0.5
          movement_time_allowance: 10.0
        general_goal_checker:
          stateful: True
          plugin: "nav2_controller::SimpleGoalChecker"
          xy_goal_tolerance: 0.25
          yaw_goal_tolerance: 6.28
        
        controller_plugins: ["FollowPath"]

        FollowPath:
          plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

          desired_linear_vel: 0.5

          # Lookahead (stable straight motion)
          lookahead_dist: 1.0
          min_lookahead_dist: 0.8
          max_lookahead_dist: 1.2
          use_velocity_scaled_lookahead_dist: True
          use_rotate_to_heading: False
          rotate_to_heading_angular_vel: 0.2  
          max_linear_vel: 0.5
          min_linear_vel: -0.5
          #max_angular_vel: 2.5
          min_angular_vel: -0.1
          # max_angular_vel: 0.8

          max_linear_accel: 6.5
          max_linear_decel: -6.5
          max_angular_accel: 6.5
          max_angular_decel: -6.5
          allow_reversing: False

          use_regulated_linear_velocity_scaling: True
          regulated_linear_scaling_min_radius: 0.2
          use_cost_regulated_linear_velocity_scaling: True
          use_collision_detection: True

          min_approach_linear_velocity: 0.2
          approach_velocity_scaling_dist: 0.2

          transform_tolerance: 0.3


    local_costmap:
      local_costmap:
        ros__parameters:
          update_frequency: 20.0
          publish_frequency: 10.0
          global_frame: odom
          robot_base_frame: base_footprint
          use_sim_time: True #False
          rolling_window: true
          width: 5
          height: 5
          resolution: 0.02
          robot_radius: 1.0
          plugins: ["obstacle_layer", "inflation_layer"]
          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            enabled: true
            observation_sources: scan
            scan:
              topic: /scan
              raytrace_max_range: 6.0
              obstacle_max_range: 6.0
              obstacle_min_range: 0.1
              min_obstacle_height: 0.2
              max_obstacle_height: 2.0
              clearing: true
              marking: true
              inf_is_valid: true
              data_type: "LaserScan"
          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            cost_scaling_factor: 5.0
            inflation_radius: 0.50
          always_send_full_costmap: true

    global_costmap:
      global_costmap:
        ros__parameters:
          update_frequency: 2.3
          publish_frequency: 2.0

          global_frame: map
          robot_base_frame: base_footprint
          use_sim_time: true

          robot_radius: 1.0
          resolution: 0.04
          track_unknown_space: true

          plugins:
            - static_layer
            - obstacle_layer
            - inflation_layer

          static_layer:
            plugin: "nav2_costmap_2d::StaticLayer"
            footprint_clearing_enabled: true
            map_subscribe_transient_local: true

          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            enabled: true
            footprint_clearing_enabled: true
            combination_method: 1

            observation_sources: scan

            scan:
              topic: /scan
              data_type: "LaserScan"

              marking: true
              clearing: true

              obstacle_min_range: 0.1
              obstacle_max_range: 20.0

              raytrace_min_range: 0.0
              raytrace_max_range: 20.0

              min_obstacle_height: 0.20
              max_obstacle_height: 1.85

              expected_update_rate: 0.0
              observation_persistence: 0.0
              inf_is_valid: true

          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            cost_scaling_factor: 3.00
            inflation_radius: 0.50

          always_send_full_costmap: true
    map_saver:
      ros__parameters:
        use_sim_time: True #False
        save_map_timeout: 5.0
        free_thresh_default: 0.25
        occupied_thresh_default: 0.65
        map_subscribe_transient_local: True

    planner_server:
      ros__parameters:
        expected_planner_frequency: 5.0
        use_sim_time: true #False
        planner_plugins: ["GridBased"]
        GridBased:
          plugin: "nav2_navfn_planner/NavfnPlanner"
          tolerance: 0.5
          use_astar: false
          allow_unknown: false

    behavior_server:
      ros__parameters:
        use_sim_time: true

        local_costmap_topic: local_costmap/costmap_raw
        global_costmap_topic: global_costmap/costmap_raw

        local_footprint_topic: local_costmap/published_footprint
        global_footprint_topic: global_costmap/published_footprint

        cycle_frequency: 10.0

        behavior_plugins:
          - spin
          - backup
          - wait

        spin:
          plugin: "nav2_behaviors/Spin"

        backup:
          plugin: "nav2_behaviors/BackUp"

        wait:
          plugin: "nav2_behaviors/Wait"

        local_frame: odom
        global_frame: map
        robot_base_frame: base_footprint

        transform_tolerance: 0.3
        simulate_ahead_time: 1.0

        max_rotational_vel: 0.8
        min_rotational_vel: 0.2
        rotational_acc_lim: 2.0

    map_server:
      ros__parameters:
        use_sim_time: True #False
        yaml_filename: ""

