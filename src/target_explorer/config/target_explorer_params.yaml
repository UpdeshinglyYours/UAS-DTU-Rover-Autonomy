target_explorer_node:
  ros__parameters:
    use_sim_time: false

    # The final destination and all dispatched goals use this map frame.
    goal_mode: "local"
    global_frame: "map"
    robot_base_frame: "base_footprint"
    target_x: 0.0
    target_y: 40.0
    target_tolerance: 1.0

    map_topic: "/map"
    global_costmap_topic: "/global_costmap/costmap"
    navigate_to_pose_action: "/navigate_to_pose"
    compute_path_to_pose_action: "/compute_path_to_pose"

    # score = progress_weight * progress
    #       + alignment_weight * alignment
    #       - path_cost_weight * Nav2 path length
    goal_progress_weight: 1.0
    target_alignment_weight: 1.0
    path_cost_weight: 0.10

    minimum_target_progress_m: 0.0
    allow_negative_progress_recovery: true

    # Unknown and inflation-gradient cells are excluded from this physical
    # obstacle clearance measurement.
    goal_obstacle_clearance_m: 0.1
    map_occupied_threshold: 65
    costmap_lethal_threshold: 100
    active_goal_safety_check_period_sec: 0.5

    minimum_frontier_distance_from_robot: 0.5
    minimum_frontier_size_m: 0.5
    maximum_goal_samples_per_frontier: 12

    planner_timeout_sec: 2.0
    tf_timeout_sec: 0.3
    persistent_tf_failure_timeout_sec: 3.0
