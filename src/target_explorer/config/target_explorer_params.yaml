target_explorer_node:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_footprint"

    # A fresh Y-forward GenZ map advances along absolute map +Y.
    target_x: 0.0
    target_y: 40.0
    target_tolerance: 1.0

    step_min: 1.0
    step_max: 10.0
    step_resolution: 0.25

    fan_angle_deg: 70.0
    fan_angle_step_deg: 7.0
    use_ray_backoff_goal_generation: true
    ray_step_resolution: 0.05
    min_frontier_goal_distance: 0.5
    frontier_backoff_distance: 0.30

    robot_radius: 0.60
    safety_margin: 0.20
    use_global_costmap_check: true
    odometry_topic: "/odometry/filtered"

    candidate_scoring:
      goal_progress_weight: 0.50
      obstacle_cost_weight: 30.0
      # 0 is straight ahead and 1 is a 180-degree turn.
      turning_cost_weight: 1.0

    require_positive_progress: true
    goal_reached_distance: 0.75
    nav_goal_timeout_sec: 45.0

    enable_backtracking: true
    stuck_attempt_threshold: 3
    nav_failure_threshold: 2
    memory_candidate_min_separation: 0.75
    max_memory_candidates: 100
    max_breadcrumbs: 100
    max_branch_candidates_per_cycle: 5
    allow_negative_progress_in_recovery: true
    recovery_target_progress_weight: 2.0
    recovery_distance_penalty_weight: 0.5
    recovery_alignment_weight: 0.5
    recovery_recency_weight: 0.1
    min_recovery_goal_distance: 1.0
    visited_goal_radius: 0.75

    loop_rate_hz: 7.5
